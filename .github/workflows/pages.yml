name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The repository root is the app; ship it without tests, design notes, smoke output and git metadata.
      - name: Assemble site
        run: |
          rsync -a ./ _site/ \
            --exclude /.git --exclude /.github --exclude /.superpowers --exclude .DS_Store \
            --exclude /test --exclude /docs/superpowers --exclude /out --exclude /_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
