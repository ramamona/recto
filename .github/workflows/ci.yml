name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Metric-compatible fallbacks for the font stacks (stable page breaks); pdftotext lets the smoke test check PDF text order.
      - name: Install fonts and pdftotext
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation
          sudo apt-get install -y poppler-utils
      - run: npm test
      # Chrome is preinstalled on ubuntu-latest; cli/chrome.js adds --no-sandbox when CI is set on Linux.
      - run: npm run smoke
