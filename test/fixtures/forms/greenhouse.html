<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Application for Software Engineer at Acme</title>
</head>
<body>
<!-- Simplified boards.greenhouse.io application form: same ids, names and labels as the real one -->
<div id="app_body">
  <div id="header"><h1 class="app-title">Software Engineer</h1><span class="company-name">at Acme</span></div>
  <form id="application_form" action="/__forms/received" method="get" enctype="multipart/form-data">
    <input type="hidden" name="job_application[gh_src]" value="board">
    <div id="main_fields">
      <div class="field"><label for="first_name">First Name <span class="asterisk">*</span></label>
        <input type="text" id="first_name" name="job_application[first_name]" aria-required="true"></div>
      <div class="field"><label for="last_name">Last Name <span class="asterisk">*</span></label>
        <input type="text" id="last_name" name="job_application[last_name]" aria-required="true"></div>
      <div class="field"><label for="email">Email <span class="asterisk">*</span></label>
        <input type="text" id="email" name="job_application[email]" aria-required="true"></div>
      <div class="field"><label for="phone">Phone <span class="asterisk">*</span></label>
        <input type="text" id="phone" name="job_application[phone]" aria-required="true"></div>
      <div class="field"><label for="job_application_location">Location (City) <span class="asterisk">*</span></label>
        <input type="text" id="job_application_location" name="job_application[location]" aria-required="true"></div>
      <div class="field"><label for="resume">Resume/CV <span class="asterisk">*</span></label>
        <input type="file" id="resume" name="job_application[resume]" aria-required="true" accept=".pdf,.doc,.docx,.txt,.rtf"></div>
      <div class="field"><label for="cover_letter">Cover Letter</label>
        <input type="file" id="cover_letter" name="job_application[cover_letter]" accept=".pdf,.doc,.docx,.txt,.rtf"></div>
    </div>
    <div id="custom_fields">
      <div class="field"><label for="q0">LinkedIn Profile</label>
        <input type="text" id="q0" name="job_application[answers_attributes][0][text_value]"></div>
      <div class="field"><label for="q1">Website</label>
        <input type="text" id="q1" name="job_application[answers_attributes][1][text_value]"></div>
      <div class="field"><label for="q2">Are you legally authorized to work in the United States? <span class="asterisk">*</span></label>
        <select id="q2" name="job_application[answers_attributes][2][boolean_value]" aria-required="true">
          <option value="">--</option><option value="1">Yes</option><option value="0">No</option>
        </select></div>
      <div class="field"><label for="q3">Will you now or in the future require sponsorship for employment visa status (e.g. H-1B visa status)? <span class="asterisk">*</span></label>
        <select id="q3" name="job_application[answers_attributes][3][boolean_value]" aria-required="true">
          <option value="">--</option><option value="1">Yes</option><option value="0">No</option>
        </select></div>
      <div class="field"><label for="q4">How did you hear about this job? <span class="asterisk">*</span></label>
        <input type="text" id="q4" name="job_application[answers_attributes][4][text_value]" aria-required="true"></div>
      <div class="field"><label for="q5">What are your salary expectations?</label>
        <input type="text" id="q5" name="job_application[answers_attributes][5][text_value]"></div>
    </div>
    <div id="eeoc_fields">
      <p>Acme is an equal opportunity employer. Completion of this section is voluntary.</p>
      <div class="field"><label for="job_application_gender">Gender</label>
        <select id="job_application_gender" name="job_application[gender]">
          <option value="">Please select</option><option value="1">Male</option><option value="2">Female</option><option value="3">Decline To Self Identify</option>
        </select></div>
      <div class="field"><label for="job_application_hispanic_ethnicity">Are you Hispanic/Latino?</label>
        <select id="job_application_hispanic_ethnicity" name="job_application[hispanic_ethnicity]">
          <option value="">Please select</option><option value="Yes">Yes</option><option value="No">No</option><option value="Decline To Self Identify">Decline To Self Identify</option>
        </select></div>
      <div class="field"><label for="job_application_veteran_status">Veteran Status</label>
        <select id="job_application_veteran_status" name="job_application[veteran_status]">
          <option value="">Please select</option><option value="1">I am not a protected veteran</option><option value="2">I identify as one or more of the classifications of a protected veteran</option><option value="3">I don't wish to answer</option>
        </select></div>
      <div class="field"><label for="job_application_disability_status">Disability Status</label>
        <select id="job_application_disability_status" name="job_application[disability_status]">
          <option value="">Please select</option><option value="1">Yes, I have a disability, or have had one in the past</option><option value="2">No, I do not have a disability and have not had one in the past</option><option value="3">I do not want to answer</option>
        </select></div>
    </div>
    <div id="submit_buttons"><button type="submit" id="submit_app">Submit Application</button></div>
  </form>
</div>
</body>
</html>
