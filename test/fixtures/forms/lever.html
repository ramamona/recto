<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme - Senior Frontend Engineer</title>
</head>
<body>
<!-- Simplified jobs.lever.co/<site>/<id>/apply form: same classes, names and labels as the real one -->
<div class="application-page">
  <div class="posting-headline"><h2>Senior Frontend Engineer</h2></div>
  <form id="application-form" class="application-form" action="/__forms/received" method="get" enctype="multipart/form-data">
    <div class="section application-form">
      <h4>Submit your application</h4>
      <ul>
        <li class="application-question resume">
          <label for="resume-upload-input"><div class="application-label">Resume/CV<span class="required">✱</span></div></label>
          <div class="application-field"><input type="file" id="resume-upload-input" name="resume" required></div>
        </li>
        <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div>
          <div class="application-field"><input type="text" name="name" required></div></label></li>
        <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div>
          <div class="application-field"><input type="email" name="email" required></div></label></li>
        <li class="application-question"><label><div class="application-label">Phone<span class="required">✱</span></div>
          <div class="application-field"><input type="text" name="phone" required></div></label></li>
        <li class="application-question"><label><div class="application-label">Current location<span class="required">✱</span></div>
          <div class="application-field"><input type="text" name="location" required></div></label></li>
        <li class="application-question"><label><div class="application-label">Current company</div>
          <div class="application-field"><input type="text" name="org"></div></label></li>
      </ul>
    </div>
    <div class="section application-form">
      <h4>Links</h4>
      <ul>
        <li class="application-question"><label><div class="application-label">LinkedIn URL</div>
          <div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
        <li class="application-question"><label><div class="application-label">GitHub URL</div>
          <div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
        <li class="application-question"><label><div class="application-label">Portfolio URL</div>
          <div class="application-field"><input type="text" name="urls[Portfolio]"></div></label></li>
      </ul>
    </div>
    <div class="section application-form">
      <h4>Additional questions</h4>
      <ul>
        <li class="application-question custom-question">
          <div class="application-label full-width"><div class="text">Are you willing to relocate?<span class="required">✱</span></div></div>
          <div class="application-field full-width">
            <ul data-qa="multiple-choice">
              <li><label><input type="radio" name="cards[3f1c][field0]" value="Yes" required><span class="application-answer-alternative">Yes</span></label></li>
              <li><label><input type="radio" name="cards[3f1c][field0]" value="No"><span class="application-answer-alternative">No</span></label></li>
            </ul>
          </div>
        </li>
        <li class="application-question custom-question">
          <div class="application-label full-width"><div class="text">Why do you want to work at Acme?<span class="required">✱</span></div></div>
          <div class="application-field full-width"><textarea name="cards[3f1c][field1]" required></textarea></div>
        </li>
      </ul>
    </div>
    <div class="section application-form">
      <h4>U.S. Equal Employment Opportunity information</h4>
      <ul>
        <li class="application-question"><label><div class="application-label">Gender</div>
          <div class="application-field"><select name="eeo[gender]"><option value="">Select ...</option><option value="Female">Female</option><option value="Male">Male</option><option value="Decline to self-identify">Decline to self-identify</option></select></div></label></li>
        <li class="application-question"><label><div class="application-label">Race</div>
          <div class="application-field"><select name="eeo[race]"><option value="">Select ...</option><option value="Asian">Asian (Not Hispanic or Latino)</option><option value="White">White (Not Hispanic or Latino)</option><option value="Decline to self-identify">Decline to self-identify</option></select></div></label></li>
        <li class="application-question"><label><div class="application-label">Veteran status</div>
          <div class="application-field"><select name="eeo[veteran]"><option value="">Select ...</option><option value="I am a veteran">I am a veteran</option><option value="I am not a veteran">I am not a veteran</option><option value="Decline to self-identify">Decline to self-identify</option></select></div></label></li>
      </ul>
    </div>
    <button type="submit" class="postings-btn template-btn-submit" id="btn-submit">Submit application</button>
  </form>
</div>
</body>
</html>
