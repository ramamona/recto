<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Careers - Sign In</title>
</head>
<body>
<!-- Account wall in front of an application (careers-portal style): sign in or create an account to apply -->
<main>
  <h1>Sign in to apply</h1>
  <form action="/__forms/received" method="get">
    <div class="field"><label for="email">Email Address *</label><input type="email" id="email" name="email" required></div>
    <div class="field"><label for="password">Password *</label><input type="password" id="password" name="password" required></div>
    <button type="submit" id="submit">Sign In</button>
  </form>
  <p>New here? <a href="#create">Create Account</a></p>
</main>
</body>
</html>
