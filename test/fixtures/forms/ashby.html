<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Platform Engineer @ Acme</title>
</head>
<body>
<!-- Simplified jobs.ashbyhq.com/<board>/<id>/application form: same system field ids and classes as the real one -->
<div class="ashby-application-form-container">
  <form action="/__forms/received" method="get" enctype="multipart/form-data">
    <div class="ashby-application-form-field-entry">
      <label class="ashby-application-form-question-title" for="_systemfield_name">Name</label>
      <input type="text" id="_systemfield_name" name="_systemfield_name" required></div>
    <div class="ashby-application-form-field-entry">
      <label class="ashby-application-form-question-title" for="_systemfield_email">Email</label>
      <input type="email" id="_systemfield_email" name="_systemfield_email" required></div>
    <div class="ashby-application-form-field-entry">
      <label class="ashby-application-form-question-title" for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone"></div>
    <div class="ashby-application-form-field-entry">
      <label class="ashby-application-form-question-title" for="_systemfield_resume">Resume</label>
      <input type="file" id="_systemfield_resume" name="_systemfield_resume" required></div>
    <div class="ashby-application-form-field-entry">
      <label class="ashby-application-form-question-title" for="linkedin">LinkedIn Profile</label>
      <input type="url" id="linkedin" name="linkedin"></div>
    <div class="ashby-application-form-field-entry">
      <label class="ashby-application-form-question-title" for="location">Where are you based?</label>
      <input type="text" id="location" name="location" required></div>
    <div class="ashby-application-form-field-entry">
      <fieldset>
        <legend class="ashby-application-form-question-title">Will you now or in the future require visa sponsorship to work for Acme?</legend>
        <label><input type="radio" name="sponsorship" value="yes" required> Yes</label>
        <label><input type="radio" name="sponsorship" value="no"> No</label>
      </fieldset></div>
    <div class="ashby-application-form-field-entry">
      <label class="ashby-application-form-question-title" for="notice">What is your notice period?</label>
      <input type="text" id="notice" name="notice"></div>
    <div class="ashby-application-form-survey">
      <h3>Voluntary Self-Identification</h3>
      <fieldset>
        <legend>Gender</legend>
        <label><input type="radio" name="eeo_gender" value="female"> Female</label>
        <label><input type="radio" name="eeo_gender" value="male"> Male</label>
        <label><input type="radio" name="eeo_gender" value="decline"> Decline to self-identify</label>
      </fieldset>
    </div>
    <button type="submit" class="ashby-application-form-submit-button">Submit Application</button>
  </form>
</div>
</body>
</html>
